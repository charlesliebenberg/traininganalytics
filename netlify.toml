[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy the API to the Render backend so the app, cookies and OAuth all live on one domain.
[[redirects]]
  from = "/api/*"
  to = "https://traininganalytics-api.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
